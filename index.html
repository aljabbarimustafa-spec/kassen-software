<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickServe POS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Kassensystem</p>
          <h1>QuickServe POS</h1>
        </div>
        <div class="topbar-actions">
          <button class="secondary" id="resetDemoBtn">Demo zurücksetzen</button>
        </div>
      </header>

      <main class="content-grid">
        <section class="catalog-panel panel">
          <div class="toolbar">
            <input id="searchInput" type="search" placeholder="Produkt suchen..." />
          </div>

          <div class="category-bar" id="categoryBar"></div>
          <div id="productGrid" class="product-grid"></div>
        </section>

        <aside class="cart-panel panel">
          <div class="cart-header">
            <h2>Bestellung</h2>
            <span id="orderBadge" class="badge">Neu</span>
          </div>

          <label>
            Bestellart
            <select id="orderType">
              <option value="Im Laden">Im Laden</option>
              <option value="Mitnahme">Mitnahme</option>
              <option value="Lieferung">Lieferung</option>
            </select>
          </label>

          <div id="cartItems" class="cart-items"></div>

          <div class="totals">
            <div><span>Zwischensumme</span><strong id="subtotalValue">0,00 €</strong></div>
            <div><span>Rabatt</span><strong id="discountValue">0,00 €</strong></div>
            <div class="grand-total"><span>Gesamt</span><strong id="totalValue">0,00 €</strong></div>
          </div>

          <div class="payment-row">
            <label>
              Bezahlung
              <select id="paymentMethod">
                <option value="Bar">Bar</option>
                <option value="Karte">Karte</option>
                <option value="PayPal">PayPal</option>
                <option value="Rechnung">Rechnung</option>
              </select>
            </label>

            <label>
              Rabatt (€)
              <input id="discountInput" type="number" min="0" step="0.50" value="0" />
            </label>
          </div>

          <div class="cart-actions">
            <button id="clearCartBtn" class="ghost">Leeren</button>
            <button id="saveOrderBtn" class="primary">Bestellung abschließen</button>
            <button id="printBtn" class="secondary">Rechnung drucken</button>
          </div>
        </aside>
      </main>

      <section class="monitor-grid">
        <div class="panel stats-panel">
          <h3>Übersicht</h3>
          <div id="statsCards" class="stats-grid"></div>
        </div>

        <div class="panel sales-panel">
          <h3>Verkäufe heute</h3>
          <div id="salesList" class="history-list"></div>
        </div>

        <div class="panel inventory-panel">
          <h3>Lagerbestand</h3>
          <div id="inventoryList" class="inventory-list"></div>
        </div>

        <div class="panel admin-panel">
          <h3>Produkte verwalten</h3>
          <form id="productForm" class="product-form">
            <input type="text" id="productName" placeholder="Produktname" required />
            <select id="productCategory">
              <option value="Döner">Döner</option>
              <option value="Burger">Burger</option>
              <option value="Pizza">Pizza</option>
              <option value="Salat">Salat</option>
              <option value="Getränke">Getränke</option>
              <option value="Snacks">Snacks</option>
            </select>
            <input type="number" id="productPrice" placeholder="Preis" min="0" step="0.50" required />
            <input type="number" id="productStock" placeholder="Lager" min="0" step="1" required />
            <button type="submit" class="primary">Produkt hinzufügen</button>
          </form>

          <div id="adminProductList" class="admin-product-list"></div>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
